name: Temperature Converter Pipeline

on:
  push:
    branches:
      - main

jobs:
  ci-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: 4. Run Automated Tests
        run: pytest test_app.py

      - name: 5. Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 6. Build and Push Docker Image
        run: |
          COMMIT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/temp-converter:$COMMIT_SHA .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/temp-converter:$COMMIT_SHA
