apiVersion: apps/v1
kind: Deployment
metadata:
  name: temp-converter-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: temp-converter
  template:
    metadata:
      labels:
        app: temp-converter
    spec:
      containers:
      - name: temp-converter-app
        image: yourdockerhubusername/temp-converter:latest
        ports:
        - containerPort: 80
